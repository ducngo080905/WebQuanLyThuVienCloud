{% if current_user and current_user.role != 'admin' and not auth_page and request.endpoint != 'chat.page' %}
<div class="chat-widget" id="chatWidget" data-user-id="{{ current_user.id }}">
  <section class="chat-widget-panel" id="chatWidgetPanel" role="region" aria-labelledby="chatWidgetTitle" aria-hidden="true" inert>
    <div class="chat-widget-bar"><div class="chat-widget-brand"><span class="chat-widget-brand-icon material-symbols-outlined">forum</span><div><strong id="chatWidgetTitle">Tin nhắn</strong><small>Kết nối cùng thư viện</small></div></div><div class="chat-widget-window-actions"><a href="/messenger" class="chat-widget-control" title="Mở trang chat đầy đủ" aria-label="Mở trang chat đầy đủ"><span class="material-symbols-outlined">open_in_full</span></a><button id="chatWidgetMinimize" class="chat-widget-control" type="button" aria-label="Thu nhỏ tin nhắn" title="Thu nhỏ"><span class="material-symbols-outlined">remove</span></button></div></div>
    <div class="chat-widget-content"><p id="chatWidgetLoading" class="chat-widget-loading" role="status">Đang mở tin nhắn…</p><iframe id="chatWidgetFrame" title="Trò chuyện thư viện" allow="camera 'self'" referrerpolicy="same-origin" data-src="/messenger?embed=1"></iframe></div>
  </section>
  <button id="chatWidgetLauncher" class="chat-widget-launcher" type="button" aria-label="Mở tin nhắn" aria-controls="chatWidgetPanel" aria-expanded="false"><svg class="chat-widget-logo" width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3C8.8 3 3 8.2 3 14.7c0 3.7 1.9 7 4.9 9.2V29l4.8-2.7c1.1.3 2.2.4 3.3.4 7.2 0 13-5.3 13-12S23.2 3 16 3Z" fill="currentColor"/><path d="m8.4 18.5 6-6.3 4 3 5.2-3.1-6 6.3-4-3-5.2 3.1Z" fill="#4163EB"/></svg><span class="material-symbols-outlined chat-widget-close-icon" aria-hidden="true">close</span><small data-chat-unread class="chat-widget-unread" hidden></small><span class="chat-widget-tooltip" aria-hidden="true">Nhắn tin cùng thư viện</span></button>
</div>
<script src="{{ url_for('static',filename='chat_widget.js',v='1') }}" defer></script>
{% endif %}
