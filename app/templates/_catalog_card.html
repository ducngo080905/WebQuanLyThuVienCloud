<article id="catalogBook{{ book.id }}" class="catalog-book" data-catalog-book data-genre="{{ book.genre or '' }}"><div class="catalog-cover {{ 'has-image' if book.cover else '' }}">{% if book.cover %}<img src="{{ url_for('main.book_cover',book_id=book.id,v=book.cover.version) }}" alt="Bìa {{ book.title }}" loading="lazy" decoding="async">{% else %}<span class="material-symbols-outlined">menu_book</span><small>{{ book.genre or 'Tổng hợp' }}</small>{% endif %}</div><div class="catalog-info"><span class="badge badge-{{ 'success' if book.available > 0 else 'warn' }}">{{ 'Có sẵn · ' ~ book.available ~ ' cuốn' if book.available > 0 else 'Đang được mượn hết' }}</span><h3><a href="{{ url_for('features.detail',book_id=book.id) }}">{{ book.title }}</a></h3><p>{{ book.author }}</p><small>ISBN: {{ book.isbn }}</small><a class="detail-link" href="{{ url_for('features.detail',book_id=book.id) }}">Thông tin &amp; đọc thử →</a><div class="borrow-action" id="borrowAction{{ book.id }}">{% include '_quick_action.html' %}</div></div></article>
