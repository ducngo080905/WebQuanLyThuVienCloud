[project]
name = "web-quan-ly-thu-vien-cloud"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.0.0",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.0.23",
    "gunicorn==21.2.0",
    "pytest==7.4.3",
    "pytest-flask==1.3.0",
    "google-auth>=2.40,<3",
    "requests>=2.32,<3",
    "Pillow>=11.0,<13",
    "pypdf>=5,<7",
    "openpyxl>=3.1,<4",
    "cryptography>=44,<51"
]

[tool.vercel]
entrypoint = "run:app"