# Example for a Linux VPS. Configure your real domain and TLS before exposing it.
upstream library_backend {
    server 127.0.0.1:5000;
    keepalive 16;
}
server {
    listen 80;
    server_name library.example.com;
    client_max_body_size 32m;
    location / {
        proxy_pass http://library_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        # Preserve the application's deliberate 503 maintenance response.
        error_page 502 504 =503 /unavailable.html;
    }
    location = /unavailable.html {
        internal;
        root /var/www/library;
        add_header Cache-Control "no-store" always;
    }
}
