# Dedicated production stack. Does not include the development Jenkins service.
services:
  app:
    image: ${APP_IMAGE:?Set a versioned image tag}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.production
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set a strong stable secret shared across releases}
      APP_VERSION: ${APP_VERSION:?Set the release or commit identifier}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set the production Google OAuth client ID}
    volumes:
      - ${LIBRARY_DATA_DIR:?Set a persistent instance directory}:/app/instance
    restart: unless-stopped
    stop_grace_period: 50s
